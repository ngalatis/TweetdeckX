<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TweetDeckX</title>
  <link rel="stylesheet" href="deck.css">
</head>
<body>
  <!-- Left Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-top">
      <div class="logo" title="TweetDeckX">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="1" y="1" width="9" height="9" rx="1.5" fill="currentColor" opacity="0.9"/>
          <rect x="14" y="1" width="9" height="9" rx="1.5" fill="currentColor" opacity="0.6"/>
          <rect x="1" y="14" width="9" height="9" rx="1.5" fill="currentColor" opacity="0.6"/>
          <rect x="14" y="14" width="9" height="9" rx="1.5" fill="currentColor" opacity="0.3"/>
        </svg>
      </div>
      <nav id="page-nav">
        <!-- Page tabs injected by deck.js -->
      </nav>
    </div>
    <div class="sidebar-bottom">
      <button id="btn-add-page" class="sidebar-btn" title="Add page">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <line x1="10" y1="4" x2="10" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="4" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="btn-settings" class="sidebar-btn" title="Settings">
        <svg width="20" height="20" viewBox="0 0 512 512" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M307.734 485.97c-2.992 0-5.848-1.497-7.534-4.079l-29.079-44.521c-10.055.851-20.189.851-30.252 0l-29.079 44.521c-2.075 3.177-5.918 4.71-9.611 3.835-17.517-4.153-34.564-10.358-50.671-18.443-3.392-1.702-5.351-5.349-4.898-9.116l6.338-52.798c-8.241-5.803-16.002-12.315-23.168-19.44l-50.896 15.405c-3.63 1.098-7.562-.198-9.828-3.241-10.761-14.461-19.833-30.173-26.963-46.697-1.503-3.483-.66-7.536 2.107-10.131l38.79-36.37c-2.585-9.755-4.345-19.734-5.252-29.79l-48.892-20.91c-3.488-1.492-5.667-5.011-5.445-8.799 1.049-17.98 4.198-35.848 9.362-53.105 1.087-3.635 4.338-6.198 8.126-6.407l53.098-2.928c4.288-9.138 9.355-17.915 15.128-26.202l-24.019-47.438c-1.715-3.386-1.121-7.483 1.484-10.243 12.354-13.091 26.252-24.752 41.308-34.66 3.17-2.086 7.309-1.959 10.345.316l42.553 31.89c9.165-4.243 18.688-7.711 28.431-10.351l12.096-51.784c.863-3.697 3.954-6.455 7.726-6.893 17.893-2.077 36.033-2.077 53.926 0 3.771.438 6.862 3.195 7.726 6.893l12.097 51.784c9.741 2.641 19.266 6.108 28.43 10.351l42.553-31.89c3.037-2.275 7.176-2.402 10.345-.316 15.029 9.891 28.926 21.551 41.306 34.657 2.606 2.76 3.201 6.859 1.486 10.246l-24.02 47.44c5.779 8.303 10.848 17.08 15.128 26.2l53.099 2.928c3.79.209 7.042 2.774 8.128 6.411 5.165 17.297 8.314 35.163 9.36 53.101.222 3.788-1.957 7.307-5.445 8.799l-48.892 20.91c-.907 10.056-2.667 20.035-5.252 29.79l38.79 36.37c2.768 2.595 3.61 6.647 2.107 10.131-7.13 16.524-16.202 32.236-26.963 46.697-2.266 3.044-6.192 4.34-9.828 3.241l-50.896-15.405c-7.166 7.125-14.927 13.638-23.168 19.44l6.338 52.798c.452 3.768-1.507 7.414-4.898 9.116-16.101 8.082-33.152 14.287-50.681 18.443-.694.165-1.391.244-2.081.244zm-32.067-67.1c3.015 0 5.859 1.516 7.533 4.078l28.559 43.723c12.003-3.222 23.728-7.489 34.995-12.735l-6.225-51.854c-.407-3.389 1.138-6.716 3.989-8.592 10.373-6.823 19.973-14.878 28.533-23.94 2.343-2.48 5.886-3.422 9.15-2.434l49.983 15.129c7.126-10.188 13.365-20.992 18.618-32.242l-38.095-35.718c-2.488-2.333-3.444-5.874-2.467-9.143 3.563-11.918 5.739-24.262 6.469-36.689.199-3.406 2.309-6.406 5.445-7.748l48.015-20.535c-1.087-12.354-3.254-24.641-6.467-36.668l-52.146-2.875c-3.407-.188-6.416-2.288-7.768-5.422-4.913-11.392-11.181-22.247-18.629-32.265-2.035-2.738-2.348-6.391-.807-9.435l23.588-46.587c-8.8-8.786-18.357-16.806-28.521-23.933l-41.789 31.318c-2.731 2.046-6.385 2.373-9.434.842-11.13-5.584-22.91-9.873-35.014-12.748-3.319-.789-5.908-3.386-6.684-6.709l-11.879-50.852c-12.385-1.071-24.862-1.071-37.245 0l-11.879 50.852c-.775 3.322-3.364 5.92-6.684 6.709-12.104 2.875-23.885 7.164-35.014 12.748-3.048 1.53-6.702 1.204-9.434-.842l-41.79-31.318c-10.179 7.136-19.736 15.154-28.522 23.931l23.589 46.589c1.542 3.045 1.229 6.701-.81 9.439-7.434 9.985-13.7 20.839-18.626 32.261-1.352 3.134-4.36 5.234-7.768 5.422l-52.148 2.876c-3.21 12.004-5.376 24.291-6.465 36.667l48.016 20.536c3.137 1.342 5.246 4.342 5.445 7.748.729 12.427 2.905 24.771 6.469 36.689.978 3.269.021 6.81-2.467 9.143l-38.095 35.718c5.253 11.25 11.492 22.055 18.618 32.242l49.983-15.129c3.265-.988 6.808-.046 9.15 2.434 8.561 9.062 18.16 17.117 28.533 23.94 2.852 1.876 4.396 5.203 3.989 8.592l-6.225 51.854c11.268 5.248 22.992 9.515 34.986 12.735l28.558-43.723c1.866-2.856 5.184-4.414 8.575-4.018 12.367 1.439 24.903 1.439 37.259 0 .356-.041.704-.061 1.05-.061zm-19.672-62.28c-53.795 0-97.56-43.765-97.56-97.56 0-53.8 43.765-97.57 97.56-97.57 53.8 0 97.569 43.77 97.569 97.57 0 53.795-43.769 97.56-97.569 97.56zm0-177.13c-43.869 0-79.56 35.695-79.56 79.57 0 43.869 35.69 79.56 79.56 79.56 43.875 0 79.569-35.69 79.569-79.56 0-43.875-35.694-79.57-79.569-79.57z"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Main Column Area -->
  <main id="columns-container">
    <!-- Page wrappers created dynamically by deck.js -->
  </main>

  <!-- Add Column Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="add-column-modal" class="modal">
      <div class="modal-header">
        <h2>Add Column</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="column-type-grid">
          <button class="type-card" data-type="home">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M3 12l9-9 9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M5 10v9a1 1 0 001 1h3v-5h6v5h3a1 1 0 001-1v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Home</span>
          </button>
          <button class="type-card" data-type="explore">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <polygon points="3,11 22,2 13,21 11,13" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
            <span>Explore</span>
          </button>
          <button class="type-card" data-type="notifications">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Notifications</span>
          </button>
          <button class="type-card" data-type="messages">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Messages</span>
          </button>
          <button class="type-card" data-type="search">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>Search</span>
          </button>
          <button class="type-card" data-type="user">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>User Profile</span>
          </button>
          <button class="type-card" data-type="list">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <line x1="8" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="8" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="8" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <circle cx="4" cy="6" r="1" fill="currentColor"/>
              <circle cx="4" cy="12" r="1" fill="currentColor"/>
              <circle cx="4" cy="18" r="1" fill="currentColor"/>
            </svg>
            <span>List</span>
          </button>
          <button class="type-card" data-type="bookmarks">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Bookmarks</span>
          </button>
          <button class="type-card" data-type="likes">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Likes</span>
          </button>
          <button class="type-card" data-type="url">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Custom URL</span>
          </button>
        </div>

        <!-- Dynamic input area (shown for search, user, list, url types) -->
        <div id="type-input-area" class="hidden">
          <label id="type-input-label" for="type-input">Query</label>
          <div class="input-row">
            <input type="text" id="type-input" placeholder="" autocomplete="off" spellcheck="false">
            <button id="btn-confirm-add" class="btn-primary">Add</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Page Modal -->
  <div id="page-modal-overlay" class="modal-overlay hidden">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2 id="page-modal-title">New Page</h2>
        <button class="modal-close" id="page-modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="page-modal-form">
          <div class="page-modal-icon-col">
            <label class="field-label">Icon</label>
            <button id="page-emoji-btn" class="emoji-btn" title="Click to change"></button>
            <div id="emoji-picker" class="emoji-picker hidden"></div>
          </div>
          <div class="page-modal-name-col">
            <label class="field-label" for="page-name-input">Name</label>
            <input type="text" id="page-name-input" placeholder="Page name" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div id="page-modal-actions" class="page-modal-actions">
          <button id="btn-page-save" class="btn-primary btn-full">Create Page</button>
          <button id="btn-page-delete" class="btn-danger-pill hidden">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-overlay" class="modal-overlay hidden">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="modal-close" id="settings-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-row">
          <label for="col-width-slider">Column width</label>
          <div class="setting-control">
            <input type="range" id="col-width-slider" min="320" max="700" step="10" value="420">
            <span id="col-width-value">420px</span>
          </div>
        </div>
        <div class="setting-row">
          <label for="theme-select">Theme</label>
          <div class="setting-control">
            <select id="theme-select">
              <option value="dark">Dark</option>
              <option value="dim">Dim</option>
              <option value="light">Light</option>
            </select>
          </div>
        </div>
        <div class="setting-row">
          <label for="hide-ads-toggle">Hide ads</label>
          <div class="setting-control">
            <input type="checkbox" id="hide-ads-toggle">
          </div>
        </div>
        <div class="setting-row">
          <label>Pages</label>
          <div class="setting-control">
            <button id="btn-reset-pages" class="btn-danger-sm">Reset all pages</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div id="empty-state" class="hidden">
    <div class="empty-content">
      <div id="empty-state-emoji" class="empty-emoji"></div>
      <h2 id="empty-state-title"></h2>
      <p id="empty-state-desc"></p>
      <button id="btn-add-column-empty" class="btn-add-column-big">
        <span>+</span> Add Column
      </button>
    </div>
  </div>

  <!-- Update Notification Toast -->
  <div id="update-toast" class="toast toast-info hidden">
    <span class="toast-icon">🎉</span>
    <span class="toast-text">A new version of TweetDeckX (<span id="update-version"></span>) is available!</span>
    <a id="update-link" class="toast-action" href="#" target="_blank" rel="noopener">Download</a>
    <button class="toast-close" id="update-toast-close">&times;</button>
  </div>

  <!-- Rate Limit Toast -->
  <div id="rate-limit-toast" class="toast hidden">
    <span class="toast-icon">⚠️</span>
    <span class="toast-text">X.com is rate limiting requests. Columns will load when limits reset.</span>
    <button class="toast-close" id="toast-close">&times;</button>
  </div>

  <script src="deck.js"></script>
</body>
</html>
